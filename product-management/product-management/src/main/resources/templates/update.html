<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Update Product</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.4.1/css/all.css">
</head>
<body>
    <div class="container my-5">
        <div class="card">
            <div class="card-header">
                <h3>Update Product</h3>
            </div>
            <div class="card-body">
                <div class="col-md-8">
                    <form action="#" th:action="@{/products/update/{id}(id=${product.id})}" 
                          th:object="${product}" method="post">
                        
                        <div class="form-group">
                            <label for="id" class="col-form-label">Product ID</label>
                            <input type="text" th:field="*{id}" class="form-control" 
                                   id="id" readonly>
                        </div>
                        
                        <div class="form-group">
                            <label for="name" class="col-form-label">Product Name</label>
                            <input type="text" th:field="*{name}" class="form-control" 
                                   id="name" placeholder="Enter product name">
                            <span th:if="${#fields.hasErrors('name')}" 
                                  th:errors="*{name}" class="text-danger"></span>
                        </div>
                        
                        <div class="form-group">
                            <label for="description" class="col-form-label">Description</label>
                            <textarea th:field="*{description}" class="form-control" 
                                      id="description" rows="3" placeholder="Enter description"></textarea>
                            <span th:if="${#fields.hasErrors('description')}" 
                                  th:errors="*{description}" class="text-danger"></span>
                        </div>
                        
                        <div class="form-group">
                            <label for="price" class="col-form-label">Price</label>
                            <input type="number" step="0.01" th:field="*{price}" class="form-control" 
                                   id="price" placeholder="Enter price">
                            <span th:if="${#fields.hasErrors('price')}" 
                                  th:errors="*{price}" class="text-danger"></span>
                        </div>
                        
                        <div class="form-group">
                            <label for="quantity" class="col-form-label">Quantity</label>
                            <input type="number" th:field="*{quantity}" class="form-control" 
                                   id="quantity" placeholder="Enter quantity">
                            <span th:if="${#fields.hasErrors('quantity')}" 
                                  th:errors="*{quantity}" class="text-danger"></span>
                        </div>
                        
                        <div class="form-group">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i> Update Product
                            </button>
                            <a href="/products/list" class="btn btn-secondary">
                                <i class="fas fa-arrow-left"></i> Cancel
                            </a>
                        </div>
                        
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
