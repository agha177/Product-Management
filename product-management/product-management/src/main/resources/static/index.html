<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Product Management System</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.4.1/css/all.css">
</head>
<body>
    <div class="container my-5">
        <div class="jumbotron">
            <h1 class="display-4">Product Management System</h1>
            <p class="lead">Welcome to the Product Management CRUD Application</p>
            <hr class="my-4">
            <p>This application allows you to manage products with full CRUD operations.</p>
            <a class="btn btn-primary btn-lg" href="/products/list" role="button">
                <i class="fas fa-list"></i> View All Products
            </a>
            <a class="btn btn-success btn-lg" href="/products/insert" role="button">
                <i class="fas fa-plus"></i> Add New Product
            </a>
        </div>
    </div>
</body>
</html>
